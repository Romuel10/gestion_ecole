name: Live Enrollment Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-enrollment-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live enrollment
        shell: bash
        run: |
          set -euxo pipefail
          EDGE='https://cmpbrouwcfoauwyeiyfj.supabase.co/functions/v1/sekoly-public-enrollment?code=46abb7a4a3244d5ba669'
          STORE='https://cmpbrouwcfoauwyeiyfj.supabase.co/storage/v1/object/public/sekoly-family-portal/enrollment/index.html?v=20260929-3'
          echo '=== EDGE HEADERS ==='
          curl -sS -D - -o /tmp/edge.body "$EDGE" | sed -n '1,30p'
          echo '=== EDGE BODY ==='
          head -c 200 /tmp/edge.body; echo
          echo '=== EDGE FOLLOW ==='
          curl -sS -L -D /tmp/follow.headers -o /tmp/follow.body -w 'FINAL=%{url_effective}\nCODE=%{http_code}\nTYPE=%{content_type}\n' "$EDGE"
          sed -n '1,80p' /tmp/follow.headers
          head -c 250 /tmp/follow.body; echo
          echo '=== STORAGE DIRECT ==='
          curl -sS -D /tmp/store.headers -o /tmp/store.body -w 'CODE=%{http_code}\nTYPE=%{content_type}\n' "$STORE"
          sed -n '1,50p' /tmp/store.headers
          head -c 250 /tmp/store.body; echo