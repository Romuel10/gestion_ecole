name: Teacher Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/teacher-mobile/**"
      - "src/types/school.ts"
      - ".github/workflows/teacher-android-apk.yml"
      - "supabase/functions/sekoly-provision-teacher/**"
      - "src/services/cloudSync.ts"
      - "src/components/settings/GeneralSettingsView.tsx"
  pull_request:
    branches: [main]
    paths:
      - "apps/teacher-mobile/**"
      - "src/types/school.ts"
      - ".github/workflows/teacher-android-apk.yml"
      - "supabase/functions/sekoly-provision-teacher/**"
      - "src/services/cloudSync.ts"
      - "src/components/settings/GeneralSettingsView.tsx"

permissions:
  contents: read

concurrency:
  group: teacher-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/teacher-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Verify patched dependencies and audit
        run: npm run security:check

      - name: Generate Sekoly Android icons
        run: |
          node scripts/generate-icons.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify embedded JavaScript bundle
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q "assets/index.android.bundle"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Sekoly-Enseignant-pilote.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sekoly-enseignant-apk
          path: apps/teacher-mobile/Sekoly-Enseignant-pilote.apk
