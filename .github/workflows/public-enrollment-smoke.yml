name: Public Enrollment Smoke
# configurable-form-rerun

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/sekoly-public-enrollment/**"
      - "src/services/cloudSync.ts"
      - "web/family-portal/enrollment/**"
      - ".github/workflows/public-enrollment-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify static family frontend
        shell: bash
        run: |
          set -euo pipefail
          URL="https://romuel10.github.io/romuel-app-store/sekoly/enrollment/index.html?code=10441a88ccdd43e183db"
          curl -sS -D /tmp/site.headers -o /tmp/site.body "$URL"
          STATUS="$(awk 'NR==1{print $2}' /tmp/site.headers)"
          TYPE="$(grep -i '^content-type:' /tmp/site.headers | tail -1 | tr -d '\r')"
          echo "status=$STATUS"
          echo "type=$TYPE"
          test "$STATUS" = "200"
          echo "$TYPE" | grep -qi "text/html"
          grep -qi "<!doctype html" /tmp/site.body
          grep -q "2026-09-29-sections-v1" /tmp/site.body
          grep -qi "SEKOLY · INSCRIPTION" /tmp/site.body
          grep -q 'id="familySections"' /tmp/site.body
          grep -q 'data-child-sections' /tmp/site.body

      - name: Verify Edge redirects browsers to the frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cmpbrouwcfoauwyeiyfj.supabase.co/functions/v1/sekoly-public-enrollment"
          for CODE in 10441a88ccdd43e183db 46abb7a4a3244d5ba669; do
            curl -sS -L -D /tmp/edge.headers -o /tmp/edge.body -w '%{url_effective}\n%{http_code}\n%{content_type}\n' "$BASE?code=$CODE" > /tmp/edge.meta
            FINAL_URL="$(sed -n '1p' /tmp/edge.meta)"
            STATUS="$(sed -n '2p' /tmp/edge.meta)"
            TYPE="$(sed -n '3p' /tmp/edge.meta)"
            echo "code=$CODE final=$FINAL_URL status=$STATUS type=$TYPE"
            test "$STATUS" = "200"
            echo "$TYPE" | grep -qi "text/html"
            echo "$FINAL_URL" | grep -q "romuel10.github.io/romuel-app-store/sekoly/enrollment/index.html"
            grep -qi "<!doctype html" /tmp/edge.body
          done

      - name: Verify bootstrap API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cmpbrouwcfoauwyeiyfj.supabase.co/functions/v1/sekoly-public-enrollment"
          OPEN="10441a88ccdd43e183db"
          CLOSED="46abb7a4a3244d5ba669"

          curl -sS -D /tmp/open.headers -o /tmp/open.body "$BASE?action=bootstrap&code=$OPEN"
          STATUS="$(awk 'NR==1{print $2}' /tmp/open.headers)"
          TYPE="$(grep -i '^content-type:' /tmp/open.headers | tail -1 | tr -d '\r')"
          test "$STATUS" = "200"
          echo "$TYPE" | grep -qi "application/json"
          grep -q '"school"' /tmp/open.body
          grep -q '"campaign"' /tmp/open.body

          curl -sS -D /tmp/closed.headers -o /tmp/closed.body "$BASE?action=bootstrap&code=$CLOSED"
          CLOSED_STATUS="$(awk 'NR==1{print $2}' /tmp/closed.headers)"
          CLOSED_TYPE="$(grep -i '^content-type:' /tmp/closed.headers | tail -1 | tr -d '\r')"
          test "$CLOSED_STATUS" = "404"
          echo "$CLOSED_TYPE" | grep -qi "application/json"
          grep -q '"error"' /tmp/closed.body

      - name: Verify QR target
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cmpbrouwcfoauwyeiyfj.supabase.co/functions/v1/sekoly-public-enrollment?code=10441a88ccdd43e183db&format=qr&smoke=1"
          curl -sS -D /tmp/qr.headers -o /tmp/qr.body "$URL"
          STATUS="$(awk 'NR==1{print $2}' /tmp/qr.headers)"
          TYPE="$(grep -i '^content-type:' /tmp/qr.headers | tail -1 | tr -d '\r')"
          TARGET="$(grep -i '^x-sekoly-qr-target:' /tmp/qr.headers | tail -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')"
          echo "status=$STATUS"
          echo "type=$TYPE"
          echo "target=$TARGET"
          test "$STATUS" = "200"
          echo "$TYPE" | grep -qi "image/svg+xml"
          echo "$TARGET" | grep -q "romuel10.github.io/romuel-app-store/sekoly/enrollment/index.html"
          grep -qi "<svg" /tmp/qr.body

      - name: Verify real browser rendering
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          URL="https://romuel10.github.io/romuel-app-store/sekoly/enrollment/index.html?code=10441a88ccdd43e183db&browser-smoke=1"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "$URL" > /tmp/dom.html
          grep -q "Romuel's School" /tmp/dom.html
          grep -q "Responsable familial" /tmp/dom.html
          grep -q "Responsable principal" /tmp/dom.html
          grep -q "Identité de l’élève" /tmp/dom.html
          grep -q "Inscriptions 2026 - 2027" /tmp/dom.html
          if grep -q "Chargement du formulaire" /tmp/dom.html && ! grep -q '<form id="form" class=""' /tmp/dom.html; then
            echo "The dynamic form did not finish loading."
            exit 1
          fi
