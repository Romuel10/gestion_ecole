name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript and Vite build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Business tests
        run: npm test

      - name: Browser smoke test of all interfaces
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sekoly-vite.log 2>&1 &
          VITE_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium introuvable sur le runner."
            exit 1
          fi

          "$CHROME_BIN"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --remote-debugging-port=9222             --user-data-dir=/tmp/sekoly-chrome             about:blank > /tmp/sekoly-chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" >/dev/null 2>&1 || true
            kill "$VITE_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          node scripts/ui-smoke.mjs
