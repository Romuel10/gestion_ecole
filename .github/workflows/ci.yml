name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript and Vite build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Business tests
        run: npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Interface tests against production bundle
        run: npm run test:ui

      - name: Upload interface test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
