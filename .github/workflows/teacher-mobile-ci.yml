name: Teacher Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/teacher-mobile/**"
      - ".github/workflows/teacher-mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/teacher-mobile/**"
      - ".github/workflows/teacher-mobile-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/teacher-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Expo doctor
        run: npx expo-doctor
