name: Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Generate Windows icons from Sekoly identity
        run: cargo tauri icon public/sekoly-app.svg

      - name: Verify single-window production config
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.app.windows.Count -ne 1) { throw "Sekoly doit démarrer avec une seule fenêtre." }
          if ($config.app.windows[0].label -ne "main") { throw "La fenêtre principale doit s'appeler main." }
          if (-not $config.app.security.csp) { throw "La CSP de production est absente." }

      - name: Build Windows installers
        run: cargo tauri build --bundles nsis,msi

      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/sekoly.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable Sekoly introuvable." }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystemOffset = $peOffset + 4 + 20 + 68
          $subsystem = [BitConverter]::ToUInt16($bytes, $subsystemOffset)
          if ($subsystem -ne 2) {
            throw "Le binaire Windows n'est pas GUI (subsystem=$subsystem) et peut ouvrir une console secondaire."
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sekoly-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
